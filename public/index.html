<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <title>Cuisine EAD 🍲</title>
        <meta name="description" content="Modifications systématiques et traitements sur fichiers XML EAD" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://fonts.googleapis.com/css?family=Caveat" rel="stylesheet" />
        <link rel="stylesheet" href="/css/app.css" />
        <script src="/js/vendor/jschardet.min.js"></script>
        <link rel="manifest" href="/manifest.json">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <meta name="theme-color" content="#fff1e5">
        <script src="https://cdn.usefathom.com/script.js" data-site="PCKRHDYI" defer></script>
    </head>
    <body>
        <script type="module">
            (function() {
                if (navigator && navigator.serviceWorker) {
                    window.addEventListener("load", () => {
                        navigator.serviceWorker.register("/js/esm/sw.js", { scope: "/" });
                    });
                }
                window.esDynamicImport = true;
                // this will throw if dynamic import is not supported
                import("/js/esm/index.js");
            })();
        </script>
        <div id="app-container"></div>
    </body>
</html>
