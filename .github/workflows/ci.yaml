name: Build and tests

on:
  push:
    branches: [ master ]
    tags:
      - '!*' # Do not execute on tags
    paths:
      - src/**
      - public/**
      - e2e/**
      - '.github/**'
      - '**.json'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare Code-Climate reporter
        continue-on-error: true
        run: |
          curl -fsSL -o ./cc-test-reporter https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64
          chmod +x ./cc-test-reporter
          ./cc-test-reporter before-build
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run jest
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Report coverage to Code Climate
        if: success()
        continue-on-error: true
        env:
          CC_TEST_REPORTER_ID: 1ba79968e72f466436bec94526c2234b000886463638859d328819c94bfe3590
        run: |
          if [ -x ./cc-test-reporter ]; then
            ./cc-test-reporter after-build --exit-code 0
          fi
